<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>第三方需求申请系统</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
h1 { font-size: 20px; color: #333; margin-bottom: 20px; border-bottom: 2px solid #1890ff; padding-bottom: 10px; }
.form-row { display: flex; margin-bottom: 16px; align-items: center; }
.form-row label { width: 120px; text-align: right; padding-right: 12px; color: #333; font-size: 14px; }
.form-row label .req { color: #ff4d4f; margin-right: 4px; }
.form-row input, .form-row select, .form-row textarea { flex: 1; height: 32px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 4px 11px; font-size: 14px; outline: none; transition: border-color 0.3s; }
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
.form-row textarea { height: 80px; resize: vertical; }
.form-row .radio-group { display: flex; gap: 16px; }
.form-row .radio-group label { width: auto; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.btn-group { text-align: center; margin-top: 24px; }
.btn-group button { padding: 8px 24px; border-radius: 4px; border: 1px solid #d9d9d9; cursor: pointer; font-size: 14px; margin: 0 8px; }
.btn-primary { background: #1890ff; color: #fff; border-color: #1890ff !important; }
.btn-primary:hover { background: #40a9ff; }
.result { margin-top: 20px; padding: 16px; background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 4px; display: none; }
.result h3 { color: #52c41a; margin-bottom: 8px; }
.result pre { font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="container">
<h1>第三方需求申请</h1>

<div class="form-row">
  <label><span class="req">*</span>需求名称</label>
  <input type="text" id="reqName" name="reqName" placeholder="请输入需求名称" required>
</div>

<div class="form-row">
  <label><span class="req">*</span>需求类型</label>
  <select id="reqType" name="reqType" required>
    <option value="">请选择</option>
    <option value="func">功能需求</option>
    <option value="bug">Bug修复</option>
    <option value="optimize">优化改进</option>
    <option value="other">其他</option>
  </select>
</div>

<div class="form-row">
  <label><span class="req">*</span>申请人</label>
  <input type="text" id="applicant" name="applicant" placeholder="请输入申请人姓名" required>
</div>

<div class="form-row">
  <label><span class="req">*</span>申请部门</label>
  <select id="department" name="department" required>
    <option value="">请选择</option>
    <option value="tech">技术部</option>
    <option value="product">产品部</option>
    <option value="ops">运营部</option>
    <option value="design">设计部</option>
    <option value="hr">人力资源部</option>
  </select>
</div>

<div class="form-row">
  <label>优先级</label>
  <select id="priority" name="priority">
    <option value="low">低</option>
    <option value="medium" selected>中</option>
    <option value="high">高</option>
    <option value="urgent">紧急</option>
  </select>
</div>

<div class="form-row">
  <label>期望完成日期</label>
  <input type="date" id="dueDate" name="dueDate">
</div>

<div class="form-row">
  <label>预估工时(人天)</label>
  <input type="number" id="workDays" name="workDays" placeholder="0" min="0" step="0.5">
</div>

<div class="form-row">
  <label>是否加急</label>
  <div class="radio-group">
    <label><input type="radio" name="urgent" value="yes"> 是</label>
    <label><input type="radio" name="urgent" value="no" checked> 否</label>
  </div>
</div>

<div class="form-row">
  <label>通知方式</label>
  <div class="radio-group">
    <label><input type="checkbox" name="notify_email" id="notifyEmail" value="email"> 邮件</label>
    <label><input type="checkbox" name="notify_dingtalk" id="notifyDingtalk" value="dingtalk"> 钉钉</label>
  </div>
</div>

<div class="form-row">
  <label><span class="req">*</span>需求描述</label>
  <textarea id="description" name="description" placeholder="请详细描述需求内容" required></textarea>
</div>

<div class="form-row">
  <label>备注</label>
  <input type="text" id="remark" name="remark" placeholder="选填">
</div>

<div class="btn-group">
  <button class="btn-primary" id="submitBtn" onclick="submitForm()">提交申请</button>
  <button onclick="resetForm()">重置</button>
</div>

<div class="result" id="result">
  <h3>✅ 提交成功</h3>
  <pre id="resultContent"></pre>
</div>
</div>

<script>
function submitForm() {
  const data = {
    需求名称: document.getElementById('reqName').value,
    需求类型: document.getElementById('reqType').value,
    申请人: document.getElementById('applicant').value,
    申请部门: document.getElementById('department').value,
    优先级: document.getElementById('priority').value,
    期望完成日期: document.getElementById('dueDate').value,
    预估工时: document.getElementById('workDays').value,
    是否加急: document.querySelector('input[name="urgent"]:checked')?.value || '',
    通知邮件: document.getElementById('notifyEmail').checked,
    通知钉钉: document.getElementById('notifyDingtalk').checked,
    需求描述: document.getElementById('description').value,
    备注: document.getElementById('remark').value,
  };
  document.getElementById('resultContent').textContent = JSON.stringify(data, null, 2);
  document.getElementById('result').style.display = 'block';
}
function resetForm() {
  document.querySelectorAll('input, textarea').forEach(el => { if(el.type!=='radio'&&el.type!=='checkbox') el.value=''; });
  document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
  document.querySelectorAll('input[type="radio"]').forEach(el => { if(el.value==='no') el.checked=true; else el.checked=false; });
  document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
  document.getElementById('result').style.display = 'none';
}
</script>
</body>
</html>
