# Continue.dev 配置模板
# 将此文件复制到 ~/.continue/config.yaml
# 或在 VS Code 中按 Ctrl+Shift+P → Continue: Open Config

version: 0.8

models:
  - name: "DistilFlow"
    provider: "openai"
    model: "enterprise-agent-default"
    apiBase: "http://127.0.0.1:8001/v1"
    apiKey: "local"
    contextLength: 32000
    completionOptions:
      temperature: 0.3
      maxTokens: 4096
    title: "🏢 DistilFlow (本地Agent)"

  - name: "DistilFlow (流式)"
    provider: "openai"
    model: "enterprise-agent-default"
    apiBase: "http://127.0.0.1:8001/v1"
    apiKey: "local"
    contextLength: 32000
    completionOptions:
      temperature: 0.3
      maxTokens: 4096
      stream: true
    title: "🏢 DistilFlow-流式"

tabAutocompleteModel:
  name: "DistilFlow"
  provider: "openai"
  model: "enterprise-agent-default"
  apiBase: "http://127.0.0.1:8001/v1"
  apiKey: "local"

embeddingsProvider:
  provider: "openai"
  model: "text-embedding-3-small"
  apiBase: "http://127.0.0.1:8001/v1"
  apiKey: "local"

allowAnonymousTelemetry: false

customCommands:
  - name: "summary"
    description: "生成工作总结"
    prompt: "请帮我生成近期工作总结"

  - name: "skills"
    description: "查看已沉淀的技能"
    prompt: "列出我所有的技能"

  - name: "consolidate"
    description: "合并技能为大工具"
    prompt: "帮我合并相关技能为一个大工具"

  - name: "distill"
    description: "查看蒸馏状态"
    prompt: "查看我的蒸馏状态和学习进度"
